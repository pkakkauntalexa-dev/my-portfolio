<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Игротека</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Manrope:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout: a shelf of toys on the left, one big lit stage on the right; on phones the shelf becomes a swipe strip above the stage */
:root{
  --ink:#0b0a1a;--panel:#17142f;--stage:#120f26;--line:#2b2654;--text:#efeaff;--muted:#a19ac9;
  --coral:#ff6b5b;--butter:#ffd25a;--mint:#46e0b0;--sky:#5ac8ff;--lilac:#a98bff;--pink:#ff8fd0;--orange:#ff9a3c;
  --display:'Unbounded',system-ui,sans-serif;--body:'Manrope',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--body);font-size:15px;display:flex;flex-direction:column;padding-inline:16px;padding-block:0 16px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--butter);outline-offset:2px}
header{display:flex;align-items:center;gap:10px 16px;padding-block:14px;flex-wrap:wrap}
.logo{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.02em;margin:0;line-height:1}
.logo span:nth-child(6n+1){color:var(--coral)}.logo span:nth-child(6n+2){color:var(--butter)}.logo span:nth-child(6n+3){color:var(--mint)}
.logo span:nth-child(6n+4){color:var(--sky)}.logo span:nth-child(6n+5){color:var(--lilac)}.logo span:nth-child(6n+6){color:var(--pink)}
.count{font-family:var(--mono);color:var(--muted);font-size:12px;letter-spacing:.04em}
.hbtns{margin-left:auto;display:flex;gap:8px}
#q{font:inherit;font-size:13px;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px;width:200px;max-width:100%}
#q::placeholder{color:var(--muted)}
#q:focus{outline:none;border-color:var(--butter)}
.pill{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 14px;font-weight:600;font-size:13px;transition:border-color .15s}
.pill:hover{border-color:var(--lilac)}
.app{flex:1;min-height:0;display:grid;grid-template-columns:240px 1fr;gap:18px}
nav{overflow-y:auto;min-height:0;padding-right:6px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.grp h3{font-family:var(--mono);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:16px 0 6px 10px;display:flex;align-items:center;gap:8px}
.grp:first-child h3{margin-top:4px}
.grp h3::before{content:'';width:9px;height:9px;border-radius:3px;background:var(--cat)}
.toy{display:block;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:7px 10px;font-weight:600;font-size:14px;color:var(--text)}
.toy:hover{background:var(--panel)}
.toy[aria-current="true"]{background:var(--cat);color:var(--ink)}
.stagewrap{display:flex;flex-direction:column;min-height:0;min-width:0;gap:10px}
.bar{display:flex;gap:12px;align-items:flex-start}
.info{flex:1;min-width:0}
.bar h2{font-family:var(--display);font-weight:800;font-size:22px;margin:0;text-wrap:balance;line-height:1.15}
.bar p{margin:5px 0 0;color:var(--muted);max-width:68ch;font-size:14px;line-height:1.45}
.nav2{display:flex;gap:6px;flex:none}
.nav2 .pill{padding:8px 12px}
.ctrls{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ctrls:empty{display:none}
.ctrl{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 11px;font-weight:600;font-size:13px}
.ctrl:hover{border-color:var(--lilac)}
.ctrl[aria-pressed="true"]{background:var(--butter);color:var(--ink);border-color:var(--butter)}
.sw{width:30px;height:30px;padding:0;border-radius:8px;border:2px solid var(--line)}
.sw[aria-pressed="true"]{border-color:var(--text);box-shadow:0 0 0 2px var(--ink) inset}
#stage{flex:1;min-height:320px;position:relative;border-radius:18px;overflow:hidden;background:var(--stage);box-shadow:0 0 0 1px var(--line),0 24px 70px -34px rgba(169,139,255,.55)}
canvas{display:block;touch-action:none;position:absolute;inset:0;cursor:crosshair}
#stat{position:absolute;top:12px;left:12px;font-family:var(--mono);font-size:13px;background:rgba(11,10,26,.72);color:var(--text);padding:6px 10px;border-radius:8px;pointer-events:none;font-variant-numeric:tabular-nums}
#stat:empty{display:none}
@media (max-width:760px){
  html,body{height:auto}
  body{display:block}
  .logo{font-size:24px}
  #q{order:5;width:100%}
  .app{display:block}
  nav{display:flex;overflow-x:auto;gap:4px;padding:0 16px 8px;margin-inline:-16px;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  .grp{display:flex;gap:6px;align-items:center;flex:none}
  .grp h3,.grp:first-child h3{margin:0 2px 0 10px;white-space:nowrap}
  .toy{white-space:nowrap;width:auto;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px}
  .stagewrap{margin-top:8px}
  .bar h2{font-size:18px}
  #stage{height:66vh;height:66svh;flex:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <h1 class="logo" aria-label="Игротека"><span>И</span><span>г</span><span>р</span><span>о</span><span>т</span><span>е</span><span>к</span><span>а</span></h1>
  <span class="count" id="count"></span>
  <input id="q" type="search" placeholder="Найти игрушку…" aria-label="Найти игрушку" autocomplete="off">
  <div class="hbtns">
    <button class="pill" id="rnd" type="button">Случайная</button>
    <button class="pill" id="snd" type="button">Звук: вкл</button>
  </div>
</header>
<div class="app">
  <nav id="menu" aria-label="Игрушки"></nav>
  <section class="stagewrap">
    <div class="bar">
      <div class="info"><h2 id="tname"></h2><p id="thint"></p></div>
      <div class="nav2">
        <button class="pill" id="prev" type="button" aria-label="Предыдущая">←</button>
        <button class="pill" id="again" type="button">Заново</button>
        <button class="pill" id="next" type="button" aria-label="Следующая">→</button>
      </div>
    </div>
    <div class="ctrls" id="ctrls"></div>
    <div id="stage"><canvas id="cv"></canvas><div id="stat"></div></div>
  </section>
</div>

<script>
const TAU=Math.PI*2,R=(a,b)=>a+Math.random()*(b-a),RI=(a,b)=>Math.floor(R(a,b+1)),pick=a=>a[Math.floor(Math.random()*a.length)],
clamp=(v,a,b)=>v<a?a:v>b?b:v,hyp=Math.hypot,PAL=['#ff6b5b','#ffd25a','#46e0b0','#5ac8ff','#a98bff','#ff8fd0'],BG='#120f26';
const cv=document.getElementById('cv'),c=cv.getContext('2d'),stage=document.getElementById('stage');
let W=0,H=0,dpr=1,cur=null,muted=false;
const P={x:0,y:0,lx:0,ly:0,vx:0,vy:0,down:false,sp:0,type:'mouse',button:0};
const statEl=document.getElementById('stat');
function stat(s){statEl.textContent=s||''}
function clear(a=1){c.fillStyle=a<1?`rgba(18,15,38,${a})`:BG;c.fillRect(0,0,W,H)}
function circle(x,y,r,f){c.beginPath();c.arc(x,y,Math.max(0,r),0,TAU);c.fillStyle=f;c.fill()}
function rr(x,y,w,h,r){c.beginPath();if(c.roundRect)c.roundRect(x,y,w,h,r);else c.rect(x,y,w,h)}
function txt(s,x,y,size,col='#efeaff',font='Unbounded',w=800){c.font=`${w} ${size}px ${font}, system-ui, sans-serif`;c.fillStyle=col;c.textAlign='center';c.textBaseline='middle';c.fillText(s,x,y)}
function panel(lines){const s=Math.min(W/12,40);c.fillStyle='rgba(11,10,26,.78)';const w=Math.min(W-32,520),h=s*1.4+lines.length*22+30;rr(W/2-w/2,H/2-h/2,w,h,16);c.fill();
  txt(lines[0],W/2,H/2-h/2+s*.95,s);for(let i=1;i<lines.length;i++)txt(lines[i],W/2,H/2-h/2+s*1.6+i*22,15,'#a19ac9','Manrope',600)}
function hsl2rgb(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,9-k(n),1));return[f(0)*255|0,f(8)*255|0,f(4)*255|0]}
function hash(n){const x=Math.sin(n*12.9898+78.233)*43758.5453;return x-Math.floor(x)}

/* ---------- звук ---------- */
let AC=null,NB=null;
function audio(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){AC=null}return AC}
function ok(){return AC&&!muted&&AC.state==='running'}
function tone(f,d=.2,type='sine',vol=.12,when=0){if(!ok())return;const t=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.03)}
function noise(d,vol,type,freq){if(!ok())return;if(!NB){NB=AC.createBuffer(1,AC.sampleRate*.6,AC.sampleRate);const a=NB.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}
  const t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NB;f.type=type;f.frequency.value=freq;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);s.connect(f).connect(g).connect(AC.destination);s.start(t);s.stop(t+d+.03)}
function kick(){if(!ok())return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.15);g.gain.setValueAtTime(.7,t);g.gain.exponentialRampToValueAtTime(.001,t+.35);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+.4)}

/* ---------- игрушки ---------- */
const T=[];function toy(o){T.push(o)}
const CATS={'Курсор':'var(--coral)','Рисование':'var(--butter)','Физика':'var(--mint)','Природа':'var(--sky)','Игры':'var(--lilac)','Музыка':'var(--pink)','Гипноз':'var(--orange)'};

toy({id:'follow',cat:'Курсор',name:'Шарики за курсором',hint:'Води мышкой или пальцем — 70 шариков догоняют тебя с разной скоростью. Зажми, чтобы они закружились хороводом.',
init(){this.b=[];for(let i=0;i<70;i++)this.b.push({x:R(0,W),y:R(0,H),vx:0,vy:0,k:R(.01,.06),d:R(.82,.93),r:R(4,14),c:PAL[i%6],a:R(0,TAU)})},
frame(dt,t){clear(.35);const ring=P.down?Math.min(W,H)*.22:0;for(const b of this.b){const tx=P.x+Math.cos(b.a+t*1.5)*ring,ty=P.y+Math.sin(b.a+t*1.5)*ring;
b.vx=(b.vx+(tx-b.x)*b.k)*b.d;b.vy=(b.vy+(ty-b.y)*b.k)*b.d;b.x+=b.vx;b.y+=b.vy;circle(b.x,b.y,b.r,b.c)}}});

toy({id:'repel',cat:'Курсор',name:'Рассыпающиеся буквы',hint:'Надпись из тысячи точек. Проведи по ней — точки разлетятся и вернутся на место. Зажми для большого взрыва.',
init(){const w=Math.max(1,Math.floor(W)),h=Math.max(1,Math.floor(H)),o=document.createElement('canvas');o.width=w;o.height=h;const g=o.getContext('2d');
let fs=200;g.font=`800 ${fs}px Unbounded, sans-serif`;const mw=g.measureText('ИГРОТЕКА').width;fs=Math.min(fs*w*.88/mw,h*.32);g.font=`800 ${fs}px Unbounded, sans-serif`;
g.textAlign='center';g.textBaseline='middle';g.fillText('ИГРОТЕКА',w/2,h/2);const d=g.getImageData(0,0,w,h).data,st=Math.max(3,Math.round(fs/18));this.st=st;this.p=[];
for(let y=0;y<h;y+=st)for(let x=0;x<w;x+=st)if(d[(y*w+x)*4+3]>128)this.p.push({hx:x,hy:y,x:R(0,w),y:R(0,h),vx:0,vy:0,c:PAL[Math.floor(x/w*6)%6]})},
frame(){clear();const rad=P.down?170:80,s=this.st*.8;for(const p of this.p){const dx=p.x-P.x,dy=p.y-P.y,d=hyp(dx,dy)||1;if(d<rad){const f=(rad-d)/rad*(P.down?9:5);p.vx+=dx/d*f;p.vy+=dy/d*f}
p.vx=(p.vx+(p.hx-p.x)*.04)*.86;p.vy=(p.vy+(p.hy-p.y)*.04)*.86;p.x+=p.vx;p.y+=p.vy;c.fillStyle=p.c;c.fillRect(p.x-s/2,p.y-s/2,s,s)}}});

toy({id:'snake',cat:'Курсор',name:'Радужный змей',hint:'Змей ползёт за курсором. Каждое нажатие делает его длиннее.',
init(){this.s=Array.from({length:40},()=>({x:P.x,y:P.y}))},
down(){for(let i=0;i<8&&this.s.length<160;i++){const l=this.s[this.s.length-1];this.s.push({x:l.x,y:l.y})}tone(R(400,700),.1,'triangle',.08)},
frame(dt,t){clear(.5);const s=this.s,h=s[0];h.x+=(P.x-h.x)*.18;h.y+=(P.y-h.y)*.18;
for(let i=1;i<s.length;i++){const a=s[i-1],b=s[i],dx=b.x-a.x,dy=b.y-a.y,d=hyp(dx,dy)||1;if(d>7){b.x=a.x+dx/d*7;b.y=a.y+dy/d*7}}
const n=s.length;for(let i=n-1;i>=0;i--){const r=4+(1-i/n)*15;circle(s[i].x,s[i].y,r,`hsl(${(t*50+i*7)%360},85%,62%)`)}
const a=Math.atan2(h.y-s[1].y,h.x-s[1].x),px=Math.cos(a+Math.PI/2),py=Math.sin(a+Math.PI/2);
for(const k of[-1,1]){const ex=h.x+px*k*8+Math.cos(a)*5,ey=h.y+py*k*8+Math.sin(a)*5;circle(ex,ey,5,'#fff');circle(ex+Math.cos(a)*2,ey+Math.sin(a)*2,2.5,BG)}}});

toy({id:'rope',cat:'Курсор',name:'Три верёвки',hint:'Три верёвки с грузиками висят на курсоре. Раскачай их резким движением.',
init(){this.seg=Math.max(9,H/38);this.r=[0,1,2].map(k=>({c:PAL[[0,2,4][k]],off:(k-1)*26,p:Array.from({length:24},(_,i)=>({x:P.x,y:P.y+i*this.seg,ox:P.x,oy:P.y+i*this.seg}))}))},
frame(){clear(.45);const g=.5,L=this.seg;for(const r of this.r){const p=r.p;p[0].x=P.x+r.off;p[0].y=P.y;
for(let i=1;i<p.length;i++){const q=p[i],vx=(q.x-q.ox)*.99,vy=(q.y-q.oy)*.99;q.ox=q.x;q.oy=q.y;q.x+=vx;q.y+=vy+g}
for(let it=0;it<8;it++)for(let i=0;i<p.length-1;i++){const a=p[i],b=p[i+1],dx=b.x-a.x,dy=b.y-a.y,d=hyp(dx,dy)||1,df=(d-L)/d;
if(i===0){b.x-=dx*df;b.y-=dy*df}else{a.x+=dx*df*.5;a.y+=dy*df*.5;b.x-=dx*df*.5;b.y-=dy*df*.5}}
for(const q of p)if(q.y>H-4)q.y=H-4;
c.strokeStyle=r.c;c.lineWidth=5;c.lineCap='round';c.lineJoin='round';c.beginPath();c.moveTo(p[0].x,p[0].y);for(let i=1;i<p.length;i++)c.lineTo(p[i].x,p[i].y);c.stroke();
const e=p[p.length-1];circle(e.x,e.y,13,r.c);circle(e.x-4,e.y-4,4,'rgba(255,255,255,.6)')}circle(P.x,P.y,6,'#efeaff')}});

toy({id:'eyes',cat:'Курсор',name:'Глазастики',hint:'Десятки глаз следят за тобой и иногда моргают. Нажми — моргнут все разом.',
init(){this.e=[];let n=0;const max=W<600?14:26;while(this.e.length<max&&n++<900){const r=R(16,Math.min(62,W*.085)),x=R(r+8,W-r-8),y=R(r+8,H-r-8);
if(this.e.every(e=>hyp(e.x-x,e.y-y)>e.r+r+12))this.e.push({x,y,r,bl:R(1,6),b:0,ic:pick(PAL)})}},
down(){for(const e of this.e)e.b=.22;tone(300,.08,'sine',.06)},
frame(dt){clear();for(const e of this.e){e.bl-=dt;if(e.bl<0){e.b=.22;e.bl=R(2,8)}let o=1;if(e.b>0){e.b-=dt;o=Math.abs(e.b/.11-1)}
const ry=Math.max(1,e.r*.9*o);c.save();c.beginPath();c.ellipse(e.x,e.y,e.r*1.1,ry,0,0,TAU);c.fillStyle='#f6f2ff';c.fill();c.clip();
const dx=P.x-e.x,dy=P.y-e.y,d=hyp(dx,dy)||1,m=Math.min(e.r*.45,d*.15),ix=e.x+dx/d*m,iy=e.y+dy/d*m;
circle(ix,iy,e.r*.5,e.ic);circle(ix,iy,e.r*(P.down?.3:.22),BG);circle(ix-e.r*.15,iy-e.r*.18,e.r*.09,'#fff');c.restore();
c.beginPath();c.ellipse(e.x,e.y,e.r*1.1,ry,0,0,TAU);c.strokeStyle='#2b2654';c.lineWidth=3;c.stroke()}}});

toy({id:'field',cat:'Курсор',name:'Магнитное поле',hint:'Сотни стрелок поворачиваются к курсору, как стрелки компаса. Зажми — поле закрутится вихрем.',
init(){},
frame(){clear();const sp=W<600?24:30,rot=P.down?Math.PI/2:0;c.lineWidth=2;c.lineCap='round';
for(let y=sp/2;y<H;y+=sp)for(let x=sp/2;x<W;x+=sp){const dx=P.x-x,dy=P.y-y,d=hyp(dx,dy),a=Math.atan2(dy,dx)+rot,l=Math.min(sp*.42,700/(d+30)+3),
ca=Math.cos(a)*l,sa=Math.sin(a)*l;c.strokeStyle=`hsl(${(250+Math.min(d,500)*.25)%360},85%,${Math.max(40,72-d*.06)}%)`;c.beginPath();c.moveTo(x-ca,y-sa);c.lineTo(x+ca,y+sa);c.stroke()}
const g=c.createRadialGradient(P.x,P.y,0,P.x,P.y,40);g.addColorStop(0,'rgba(255,210,90,.9)');g.addColorStop(1,'rgba(255,210,90,0)');c.fillStyle=g;c.fillRect(P.x-40,P.y-40,80,80)}});

toy({id:'flies',cat:'Курсор',name:'Светлячки',hint:'Светлячки любопытны и подлетают к курсору. Зажми — они в испуге разлетятся.',
init(){this.f=Array.from({length:W<600?60:110},()=>({x:R(0,W),y:R(0,H),vx:R(-1,1),vy:R(-1,1),ph:R(0,TAU),fr:R(1.5,4),c:Math.random()<.7?'255,226,120':'160,255,200'}))},
frame(dt,t){const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0c1428');g.addColorStop(1,'#0d2a24');c.fillStyle=g;c.fillRect(0,0,W,H);
c.fillStyle='#071812';c.beginPath();c.moveTo(0,H);for(let x=0;x<=W;x+=14)c.lineTo(x,H-18-Math.abs(Math.sin(x*.7))*26);c.lineTo(W,H);c.fill();
c.globalCompositeOperation='lighter';for(const f of this.f){const dx=P.x-f.x,dy=P.y-f.y,d=hyp(dx,dy)||1;
if(P.down&&d<260){f.vx-=dx/d*.6;f.vy-=dy/d*.6}else if(d<280){f.vx+=dx/d*.04+(-dy/d)*.03;f.vy+=dy/d*.04+(dx/d)*.03}
f.vx+=R(-.08,.08);f.vy+=R(-.08,.08);f.vx*=.97;f.vy*=.97;f.x+=f.vx;f.y+=f.vy;if(f.x<0||f.x>W)f.vx*=-1;if(f.y<0||f.y>H)f.vy*=-1;f.x=clamp(f.x,0,W);f.y=clamp(f.y,0,H);
const b=.35+.65*Math.max(0,Math.sin(t*f.fr+f.ph)),gr=c.createRadialGradient(f.x,f.y,0,f.x,f.y,16);gr.addColorStop(0,`rgba(${f.c},${b})`);gr.addColorStop(1,`rgba(${f.c},0)`);c.fillStyle=gr;c.fillRect(f.x-16,f.y-16,32,32);circle(f.x,f.y,1.6,`rgba(255,255,240,${b})`)}}});

toy({id:'hole',cat:'Курсор',name:'Чёрная дыра',hint:'Частицы кружат вокруг курсора по орбитам. Зажми — гравитация усилится и дыра начнёт их поглощать.',
init(){this.p=Array.from({length:W<600?450:850},()=>this.np(true))},

frame(){c.fillStyle='rgba(8,6,20,.22)';c.fillRect(0,0,W,H);const G=P.down?7000:2000,mx=Math.max(W,H);c.globalCompositeOperation='lighter';
for(let i=0;i<this.p.length;i++){const p=this.p[i],dx=P.x-p.x,dy=P.y-p.y,d2=dx*dx+dy*dy+120,d=Math.sqrt(d2);p.vx+=dx/d*G/d2;p.vy+=dy/d*G/d2;p.x+=p.vx;p.y+=p.vy;

c.fillStyle=g;c.fillRect(P.x-46,P.y-46,92,92);circle(P.x,P.y,15,'#000')}});

toy({id:'warp',cat:'Курсор',name:'Гиперпрыжок',hint:'Звёздное небо летит навстречу. Курсор задаёт направление полёта, зажатая кнопка включает гиперскорость.',
init(){this.s=Array.from({length:600},()=>({x:R(-1,1)*W,y:R(-1,1)*H,z:R(1,W)}));this.v=4;this.cx=W/2;this.cy=H/2},
frame(){clear(.45);this.v+=((P.down?48:4)-this.v)*.05;this.cx+=(P.x-this.cx)*.05;this.cy+=(P.y-this.cy)*.05;c.lineCap='round';
for(const s of this.s){const pz=s.z;s.z-=this.v;if(s.z<1){s.z=W;s.x=R(-1,1)*W;s.y=R(-1,1)*H;continue}const f=W*.5,
x1=this.cx+s.x/pz*f,y1=this.cy+s.y/pz*f,x2=this.cx+s.x/s.z*f,y2=this.cy+s.y/s.z*f;c.lineWidth=Math.max(.5,(1-s.z/W)*3.2);
c.strokeStyle=this.v>15?`hsl(${200+s.z/W*80},90%,80%)`:'#e9e6ff';c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke()}}});

toy({id:'boids',cat:'Курсор',name:'Стая рыбок',hint:'Рыбки плывут стаей: держатся вместе и выравнивают курс. Курсор для них — хищник, а нажатие — большая акула.',
init(){this.b=Array.from({length:W<600?70:130},()=>({x:R(0,W),y:R(0,H),vx:R(-2,2),vy:R(-2,2),c:pick(['#46e0b0','#5ac8ff','#a98bff','#ffd25a'])}))},
frame(){const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0f2a44');g.addColorStop(1,'#0a1428');c.fillStyle=g;c.fillRect(0,0,W,H);const B=this.b;
for(const a of B){let n=0,ax=0,ay=0,cx=0,cy=0,sx=0,sy=0;for(const o of B){if(o===a)continue;const dx=o.x-a.x,dy=o.y-a.y,d2=dx*dx+dy*dy;if(d2<2600){n++;ax+=o.vx;ay+=o.vy;cx+=o.x;cy+=o.y;if(d2<420){sx-=dx/(d2+1)*20;sy-=dy/(d2+1)*20}}}
if(n){a.vx+=(ax/n-a.vx)*.05+(cx/n-a.x)*.0015;a.vy+=(ay/n-a.vy)*.05+(cy/n-a.y)*.0015}a.vx+=sx*.05;a.vy+=sy*.05;

const s=hyp(a.vx,a.vy)||1,ns=clamp(s,1.6,P.down?5:3.4);a.vx=a.vx/s*ns;a.vy=a.vy/s*ns;a.x=(a.x+a.vx+W)%W;a.y=(a.y+a.vy+H)%H;

/* ---- рисование ---- */
function shape(k,x,y,s,rot,col){c.save();c.translate(x,y);c.rotate(rot);c.fillStyle=col;c.beginPath();
 if(k===0)c.arc(0,0,s,0,TAU);else if(k===1)c.rect(-s*.85,-s*.85,s*1.7,s*1.7);
 else if(k===2){for(let i=0;i<3;i++){const a=i*TAU/3-Math.PI/2;c.lineTo(Math.cos(a)*s*1.2,Math.sin(a)*s*1.2)}}

 else{c.arc(0,0,s,0,TAU);c.moveTo(s*.55,0);c.arc(0,0,s*.55,0,TAU,true)}
 c.closePath();c.fill('evenodd');c.restore()}
toy({id:'stamps',cat:'Рисование',name:'Штампы-фигурки',hint:'Рисуй фигурками: веди с зажатой кнопкой. Быстрее движение — крупнее фигуры. Форму выбери кнопками сверху.',
init(){if(this.kind===undefined)this.kind=-1;this.h=R(0,360);this.first=true;clear();for(let i=0;i<34;i++)this.stamp(R(30,W-30),R(30,H-30),R(8,30))},
stamp(x,y,s){shape(this.kind<0?RI(0,4):this.kind,x,y,s,R(0,TAU),`hsl(${this.h},85%,63%)`);this.h=(this.h+9)%360},
frame(){if(P.down){const d=hyp(P.x-this.lx,P.y-this.ly),s=clamp(6+P.sp*1.1,7,46);if(this.first||d>s*1.15){this.first=false;this.stamp(P.x,P.y,s);this.lx=P.x;this.ly=P.y}}else this.first=true},
controls:[...['Круги','Квадраты','Треугольники','Звёзды','Кольца','Вперемешку'].map((t,i)=>({t,on(){return this.kind===(i<5?i:-1)},f(){this.kind=i<5?i:-1}})),{t:'Очистить',f(){clear()}}]});

toy({id:'kaleido',cat:'Рисование',name:'Калейдоскоп',hint:'Рисуй где угодно — линия повторится зеркально во всех лучах. Цвет меняется сам.',
init(){if(!this.n)this.n=8;this.h=R(0,360);this.lx=null;clear();let x=W/2+30,y=H/2;for(let i=0;i<260;i++){const nx=clamp(x+R(-14,14),0,W),ny=clamp(y+R(-14,14),0,H);this.stroke(x,y,nx,ny);x=nx;y=ny}},
stroke(x1,y1,x2,y2){const cx=W/2,cy=H/2;c.lineWidth=3;c.lineCap='round';c.strokeStyle=`hsl(${this.h},90%,65%)`;
for(let i=0;i<this.n;i++)for(const m of[1,-1]){c.save();c.translate(cx,cy);c.rotate(i*TAU/this.n);c.scale(1,m);c.beginPath();c.moveTo(x1-cx,y1-cy);c.lineTo(x2-cx,y2-cy);c.stroke();c.restore()}this.h=(this.h+.7)%360},
frame(){if(P.down){if(this.lx!==null)this.stroke(this.lx,this.ly,P.x,P.y);this.lx=P.x;this.ly=P.y}else this.lx=null},
controls:[...[6,8,12,16].map(n=>({t:n+' лучей',on(){return this.n===n},f(){this.n=n}})),{t:'Очистить',f(){clear()}}]});

toy({id:'neon',cat:'Рисование',name:'Неоновая кисть',hint:'Светящиеся линии гаснут через пару секунд. Пока ты не рисуешь, кисть водит сама.',
init(){this.p=[];this.sid=0;this.idle=3;this.h=R(0,360)},
down(){this.sid++},
frame(dt,t){clear();if(P.down){this.p.push({x:P.x,y:P.y,t,s:this.sid,h:this.h});this.h=(this.h+2)%360;this.idle=0}
else{this.idle+=dt;if(this.idle>2)this.p.push({x:W/2+Math.sin(t*1.3)*W*.32,y:H/2+Math.sin(t*1.9+1)*H*.32,t,s:-1,h:(t*60)%360})}
this.p=this.p.filter(p=>t-p.t<2.2);c.globalCompositeOperation='lighter';c.lineCap='round';
for(let i=1;i<this.p.length;i++){const a=this.p[i-1],b=this.p[i];if(a.s!==b.s)continue;const al=1-(t-b.t)/2.2;
for(const[w,k,l]of[[16,.12,60],[7,.35,62],[2.5,1,88]]){c.lineWidth=w;c.strokeStyle=`hsla(${b.h},100%,${l}%,${al*k})`;c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.stroke()}}}});

toy({id:'spiro',cat:'Рисование',name:'Спирограф',hint:'Узор рисуется сам. Положение курсора меняет размер колёс — веди медленно и смотри, как он перестраивается. Нажми, чтобы начать с чистого листа.',
init(){clear();this.th=0;this.h=R(0,360);this.pr=null},
down(){clear();this.pr=null},
frame(){c.fillStyle='rgba(18,15,38,.025)';c.fillRect(0,0,W,H);const Rr=Math.min(W,H)*.3,r=Rr*(.15+clamp(P.x/W,0,1)*.7),d=r*(.4+clamp(P.y/H,0,1)*1.2),k=(Rr-r)/r;
c.lineWidth=1.6;for(let i=0;i<18;i++){this.th+=.035;const x=W/2+(Rr-r)*Math.cos(this.th)+d*Math.cos(k*this.th),y=H/2+(Rr-r)*Math.sin(this.th)-d*Math.sin(k*this.th);
if(this.pr){c.strokeStyle=`hsl(${this.h},90%,66%)`;c.beginPath();c.moveTo(this.pr.x,this.pr.y);c.lineTo(x,y);c.stroke()}this.pr={x,y};this.h=(this.h+.12)%360}}});

const HEART=['','..XXXX....XXXX..','.XXwwXX..XXXXXX.','XXwwXXXXXXXXXXXX','XXwXXXXXXXXXXXXX','XXXXXXXXXXXXXXXX','XXXXXXXXXXXXXXXX','.XXXXXXXXXXXXXX.','..XXXXXXXXXXXX..','...XXXXXXXXXX...','....XXXXXXXX....','.....XXXXXX.....','......XXXX......','.......XX.......'];
toy({id:'pixel',cat:'Рисование',name:'Пиксель-арт',hint:'Холст 16×16. Выбери цвет и рисуй по клеткам. Для начала там уже нарисовано сердечко.',
init(){this.n=16;if(this.col===undefined)this.col=PAL[0];this.g=new Array(256).fill(null);HEART.forEach((row,j)=>{for(let i=0;i<16;i++){const ch=row[i];if(ch==='X')this.g[(j+1)*16+i]=PAL[0];if(ch==='w')this.g[(j+1)*16+i]='#ffffff'}})},
lay(){const cs=Math.floor(Math.min(W-32,H-32)/16);return{cs,ox:Math.floor((W-cs*16)/2),oy:Math.floor((H-cs*16)/2)}},
paint(x,y){const{cs,ox,oy}=this.lay(),i=Math.floor((x-ox)/cs),j=Math.floor((y-oy)/cs);if(i>=0&&j>=0&&i<16&&j<16)this.g[j*16+i]=this.col},
down(x,y){this.paint(x,y)},move(x,y){if(P.down)this.paint(x,y)},
frame(){clear();const{cs,ox,oy}=this.lay();for(let j=0;j<16;j++)for(let i=0;i<16;i++){const v=this.g[j*16+i];c.fillStyle=v||((i+j)%2?'#1d1940':'#221d4a');c.fillRect(ox+i*cs,oy+j*cs,cs,cs)}
c.strokeStyle='rgba(255,255,255,.06)';c.lineWidth=1;c.beginPath();for(let k=0;k<=16;k++){c.moveTo(ox+k*cs,oy);c.lineTo(ox+k*cs,oy+cs*16);c.moveTo(ox,oy+k*cs);c.lineTo(ox+cs*16,oy+k*cs)}c.stroke()},
controls:[...[...PAL,'#ffffff','#7a4e2d','#2b2654'].map(col=>({t:'Цвет',sw:col,on(){return this.col===col},f(){this.col=col}})),{t:'Ластик',on(){return this.col===null},f(){this.col=null}},{t:'Очистить',f(){this.g.fill(null)}}]});

toy({id:'sand',cat:'Рисование',name:'Цветной песок',hint:'Зажми и сыпь песок — он падает, скатывается и копится барханами. Цвет плавно меняется.',
init(){this.s=W<600?4:5;this.gw=Math.ceil(W/this.s);this.gh=Math.ceil(H/this.s);this.g=new Uint32Array(this.gw*this.gh);this.o=document.createElement('canvas');this.o.width=this.gw;this.o.height=this.gh;
this.oc=this.o.getContext('2d');this.img=this.oc.createImageData(this.gw,this.gh);this.d32=new Uint32Array(this.img.data.buffer);this.h=R(0,360);
for(let i=0;i<this.gw;i++){const hgt=Math.floor((Math.sin(i/this.gw*Math.PI*2.2)+1.2)*this.gh*.12);for(let j=0;j<hgt;j++)this.g[(this.gh-1-j)*this.gw+i]=this.col((i*.6+j*2)%360)}},
col(h){const[r,g,b]=hsl2rgb(h,80,62);return((255<<24)|(b<<16)|(g<<8)|r)>>>0},
frame(){const{gw,gh,g}=this;if(P.down){const cx=Math.floor(P.x/this.s),cy=Math.floor(P.y/this.s),v=this.col(this.h);this.h=(this.h+.8)%360;
for(let k=0;k<14;k++){const x=cx+RI(-4,4),y=cy+RI(-4,4);if(x>=0&&y>=0&&x<gw&&y<gh&&!g[y*gw+x])g[y*gw+x]=v}}
for(let y=gh-2;y>=0;y--){const dir=Math.random()<.5,row=y*gw;for(let n=0;n<gw;n++){const x=dir?n:gw-1-n,i=row+x,v=g[i];if(!v)continue;const b=i+gw;
if(!g[b]){g[b]=v;g[i]=0}else{const l=x>0&&!g[b-1],r=x<gw-1&&!g[b+1];if(l&&r){const t=Math.random()<.5?b-1:b+1;g[t]=v;g[i]=0}else if(l){g[b-1]=v;g[i]=0}else if(r){g[b+1]=v;g[i]=0}}}}
const bg=((255<<24)|(38<<16)|(15<<8)|18)>>>0;for(let i=0;i<g.length;i++)this.d32[i]=g[i]||bg;this.oc.putImageData(this.img,0,0);c.imageSmoothingEnabled=false;c.drawImage(this.o,0,0,gw*this.s,gh*this.s)},
controls:[{t:'Очистить',f(){this.g.fill(0)}}]});

/* ---- физика ---- */
toy({id:'balls',cat:'Физика',name:'Прыгучие мячики',hint:'Нажми на пустое место — появится мячик. Хватай мячики и бросай их об стены.',
init(){this.b=[];this.g=null;for(let i=0;i<14;i++)this.add(R(40,W-40),R(40,H/2))},
add(x,y){this.b.push({x,y,vx:R(-3,3),vy:0,r:R(14,34),c:pick(PAL)});if(this.b.length>60)this.b.shift()},
down(x,y){const b=this.b.find(b=>hyp(b.x-x,b.y-y)<b.r+4);if(b)this.g=b;else{this.add(x,y);tone(R(300,600),.1,'sine',.08)}},
up(){this.g=null},
frame(){clear();const B=this.b;for(const b of B){if(b===this.g){b.vx=P.x-b.x;b.vy=P.y-b.y;b.x=P.x;b.y=P.y;continue}b.vy+=.4;b.x+=b.vx;b.y+=b.vy;
if(b.y+b.r>H){b.y=H-b.r;b.vy*=-.78;b.vx*=.985}if(b.y-b.r<0){b.y=b.r;b.vy*=-.78}if(b.x-b.r<0){b.x=b.r;b.vx*=-.8}if(b.x+b.r>W){b.x=W-b.r;b.vx*=-.8}}
for(let i=0;i<B.length;i++)for(let j=i+1;j<B.length;j++){const a=B[i],b=B[j],dx=b.x-a.x,dy=b.y-a.y,d=hyp(dx,dy)||1,o=a.r+b.r-d;if(o<=0)continue;
const nx=dx/d,ny=dy/d,ma=a===this.g?1e9:a.r*a.r,mb=b===this.g?1e9:b.r*b.r,s=ma+mb;a.x-=nx*o*mb/s;a.y-=ny*o*mb/s;b.x+=nx*o*ma/s;b.y+=ny*o*ma/s;
const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rv<0){const imp=-1.85*rv/(1/ma+1/mb);a.vx-=imp/ma*nx;a.vy-=imp/ma*ny;b.vx+=imp/mb*nx;b.vy+=imp/mb*ny}}
for(const b of B){circle(b.x,b.y,b.r,b.c);circle(b.x-b.r*.35,b.y-b.r*.35,b.r*.25,'rgba(255,255,255,.45)')}},
controls:[{t:'Ещё 10 мячиков',f(){for(let i=0;i<10;i++)this.add(R(40,W-40),R(20,H/3))}}]});

toy({id:'cloth',cat:'Физика',name:'Ткань',hint:'Сетка-ткань висит на гвоздиках. В режиме «Тянуть» хватай её и растягивай, в режиме «Рвать» режь курсором.',
init(){if(!this.mode)this.mode='pull';const cols=W<600?16:28,rows=W<600?14:16,sp=Math.min(W*.85/cols,H*.65/rows),ox=(W-sp*cols)/2,oy=24;this.p=[];this.k=[];this.gr=null;
for(let j=0;j<=rows;j++)for(let i=0;i<=cols;i++){const x=ox+i*sp,y=oy+j*sp;this.p.push({x,y,ox:x,oy:y,pin:j===0&&i%2===0});const id=this.p.length-1;
if(i>0)this.k.push([id-1,id,sp]);if(j>0)this.k.push([id-cols-1,id,sp])}},
down(x,y){if(this.mode==='pull'){let best=null,bd=50;for(const p of this.p){const d=hyp(p.x-x,p.y-y);if(d<bd){bd=d;best=p}}this.gr=best}},
up(){this.gr=null},
frame(){clear();for(const p of this.p){if(p.pin)continue;const vx=(p.x-p.ox)*.99,vy=(p.y-p.oy)*.99;p.ox=p.x;p.oy=p.y;p.x+=vx;p.y+=vy+.35}
if(this.gr&&P.down){this.gr.x=P.x;this.gr.y=P.y}
if(this.mode==='tear'&&P.down)this.k=this.k.filter(([a,b])=>{const A=this.p[a],B=this.p[b];return hyp((A.x+B.x)/2-P.x,(A.y+B.y)/2-P.y)>14});
for(let it=0;it<4;it++){for(const k of this.k){const A=this.p[k[0]],B=this.p[k[1]],dx=B.x-A.x,dy=B.y-A.y,d=hyp(dx,dy)||1;if(d>k[2]*5){k[3]=1;continue}const df=(d-k[2])/d*.5;
if(!A.pin){A.x+=dx*df;A.y+=dy*df}if(!B.pin){B.x-=dx*df;B.y-=dy*df}}this.k=this.k.filter(k=>!k[3])}
c.lineWidth=1.2;for(const[col,lo,hi]of[['#46e0b0',0,1.15],['#ffd25a',1.15,1.6],['#ff6b5b',1.6,99]]){c.strokeStyle=col;c.beginPath();
for(const k of this.k){const A=this.p[k[0]],B=this.p[k[1]],s=hyp(B.x-A.x,B.y-A.y)/k[2];if(s>=lo&&s<hi){c.moveTo(A.x,A.y);c.lineTo(B.x,B.y)}}c.stroke()}

toy({id:'dpend',cat:'Физика',name:'Двойной маятник',hint:'Классический пример хаоса: маятник на маятнике. Нажми, чтобы отпустить его из новой точки, — траектория каждый раз другая.',
init(){this.a1=Math.PI*.6;this.a2=Math.PI*.9;this.w1=0;this.w2=0;this.tr=[];this.h=R(0,360)},

const L=Math.min(W,H)*.22,ox=W/2,oy=H*.32,x1=ox+Math.sin(this.a1)*L,y1=oy+Math.cos(this.a1)*L,x2=x1+Math.sin(this.a2)*L,y2=y1+Math.cos(this.a2)*L;

toy({id:'newton',cat:'Физика',name:'Колыбель Ньютона',hint:'Оттяни крайний шарик и отпусти — удар передастся через всю цепочку. Попробуй оттянуть сразу два.',

px(i){return this.ox+i*2*this.r},
down(x,y){let bi=-1,bd=1e9;this.b.forEach((b,i)=>{const d=hyp(this.px(i)+Math.sin(b.a)*this.L-x,this.oy+Math.cos(b.a)*this.L-y);if(d<bd){bd=d;bi=i}});if(bd<this.r*2.5)this.g=bi},

for(let s=0;s<st;s++){for(let i=0;i<n;i++){if(i===this.g){B[i].a=Math.asin(clamp((P.x-this.px(i))/this.L,-.95,.95));B[i].w=0;for(let j=i-1;j>=0;j--)if(B[j].a>B[j+1].a)B[j].a=B[j+1].a;for(let j=i+1;j<n;j++)if(B[j].a<B[j-1].a)B[j].a=B[j-1].a;continue}
B[i].w+=-G*Math.sin(B[i].a)*h;B[i].w*=.9997;B[i].a+=B[i].w*h}
for(let k=0;k<n;k++)for(let i=0;i<n-1;i++){const a=B[i],b=B[i+1],xa=this.px(i)+Math.sin(a.a)*this.L,xb=this.px(i+1)+Math.sin(b.a)*this.L;if(xb-xa<2*this.r-.01&&a.w>b.w){const tw=a.w;a.w=b.w;b.w=tw;if(k===0&&Math.abs(tw-a.w)>.4)tone(2400,.03,'sine',.03)}}}
c.fillStyle='#2b2654';c.fillRect(this.ox-this.r*2,this.oy-10,(n+1)*2*this.r,8);
B.forEach((b,i)=>{const x=this.px(i)+Math.sin(b.a)*this.L,y=this.oy+Math.cos(b.a)*this.L;c.strokeStyle='rgba(239,234,255,.5)';c.lineWidth=1.5;c.beginPath();c.moveTo(this.px(i),this.oy);c.lineTo(x,y);c.stroke();

toy({id:'springs',cat:'Физика',name:'Пружинки',hint:'Грузы разной массы висят на пружинах. Хватай любой, оттягивай и отпускай.',

const dx=s.x-s.ax,dy=s.y-s.ay,d=hyp(dx,dy)||1,ux=dx/d,uy=dy/d;c.strokeStyle='#cfc9ee';c.lineWidth=1.6;c.beginPath();c.moveTo(s.ax,s.ay);for(let k=1;k<18;k++){const t=k/18,sd=(k%2?1:-1)*10;c.lineTo(s.ax+dx*t-uy*sd,s.ay+dy*t+ux*sd)}c.lineTo(s.x,s.y);c.stroke();

toy({id:'liquid',cat:'Физика',name:'Жидкость',hint:'Сотни капель ведут себя как вода. Мешай курсором, зажми, чтобы закрутить водоворот, или переверни гравитацию.',
init(){const n=W<600?260:520;this.r=5;this.p=Array.from({length:n},()=>({x:R(20,W-20),y:R(H*.35,H-10),vx:0,vy:0}));if(!this.gy)this.gy=1},
frame(){const p=this.p,r=this.r,D=r*2.4,gw=Math.ceil(W/D)+2,grid=new Map();
for(let i=0;i<p.length;i++){const k=Math.floor(p[i].y/D)*gw+Math.floor(p[i].x/D);let a=grid.get(k);if(!a)grid.set(k,a=[]);a.push(i)}
for(let i=0;i<p.length;i++){const a=p[i],gx=Math.floor(a.x/D),gy=Math.floor(a.y/D);for(let yy=gy-1;yy<=gy+1;yy++)for(let xx=gx-1;xx<=gx+1;xx++){const cell=grid.get(yy*gw+xx);if(!cell)continue;
for(const j of cell){if(j<=i)continue;const b=p[j],dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy;if(d2<D*D&&d2>.01){const d=Math.sqrt(d2),f=(D-d)/D*.6,nx=dx/d,ny=dy/d;a.vx-=nx*f;a.vy-=ny*f;b.vx+=nx*f;b.vy+=ny*f;

for(const a of p){a.vy+=.18*this.gy;const dx=a.x-P.x,dy=a.y-P.y,d=hyp(dx,dy)||1,rad=P.down?90:50;if(d<rad){const f=(1-d/rad)*(P.down?2:.8);a.vx+=dx/d*f*(P.down?.3:1)+(P.down?-dy/d*f:0);a.vy+=dy/d*f*(P.down?.3:1)+(P.down?dx/d*f:0)}
a.vx*=.99;a.vy*=.99;a.x+=a.vx;a.y+=a.vy;if(a.x<r){a.x=r;a.vx*=-.3}if(a.x>W-r){a.x=W-r;a.vx*=-.3}if(a.y<r){a.y=r;a.vy*=-.3}if(a.y>H-r){a.y=H-r;a.vy*=-.3}}
clear();c.fillStyle='rgba(90,200,255,.55)';c.beginPath();for(const a of p){c.moveTo(a.x+r*1.9,a.y);c.arc(a.x,a.y,r*1.9,0,TAU)}c.fill();c.fillStyle='#d6f3ff';for(const a of p)c.fillRect(a.x-1,a.y-1,2,2)},

toy({id:'strings2',cat:'Физика',name:'Струны',hint:'Четыре натянутые струны. Зацепи струну, оттяни и отпусти — она задрожит и зазвучит.',
init(){this.N=120;this.s=[0,1,2,3].map(k=>({y:H*(k+1)/5,u:new Float32Array(this.N),v:new Float32Array(this.N),c:PAL[k+1],f:[196,246.94,293.66,392][k]}));this.g=null},

else for(let it=0;it<6;it++){for(let i=1;i<N-1;i++)s.v[i]+=(s.u[i-1]+s.u[i+1]-2*s.u[i])*.45;for(let i=1;i<N-1;i++){s.v[i]*=.9985;s.u[i]+=s.v[i]}}
c.strokeStyle=s.c;c.lineWidth=2.5;c.beginPath();for(let i=0;i<N;i++){const x=i/(N-1)*W;i?c.lineTo(x,s.y+s.u[i]):c.moveTo(x,s.y+s.u[i])}c.stroke();circle(4,s.y,4,'#efeaff');circle(W-4,s.y,4,'#efeaff')}}});

toy({id:'wave',cat:'Физика',name:'Волновая ванна',hint:'Двумерные волны на воде. Веди курсором или нажимай — волны отражаются от стенок и складываются.',
init(){offscreen(this,W<600?5:4);const n=this.gw*this.gh;this.a=new Float32Array(n);this.b=new Float32Array(n);this.auto=0},
poke(x,y,s){const{gw,gh}=this,cx=Math.floor(x/this.cs),cy=Math.floor(y/this.cs);for(let j=-3;j<=3;j++)for(let i=-3;i<=3;i++){const X=cx+i,Y=cy+j;if(X>0&&Y>0&&X<gw-1&&Y<gh-1&&i*i+j*j<=9)this.a[Y*gw+X]+=s}},

toy({id:'gears',cat:'Физика',name:'Шестерёнки',hint:'Механизм из шести шестерёнок. Курсор задаёт скорость главной, а любую шестерёнку можно крутить рукой — остальные подхватят.',
init(){const ns=[18,10,24,12,16,9],m=Math.min(W*.85/80,H/30);this.m=m;this.g=[];ns.forEach((n,i)=>{const r=n*m/2;if(i){const pr=this.g[i-1],b=i%2?.45:-.45;this.g.push({n,r,x:pr.x+Math.cos(b)*(pr.r+r),y:pr.y+Math.sin(b)*(pr.r+r),b,th:0})}else this.g.push({n,r,x:0,y:0,b:0,th:0})});
let a=1e9,b=-1e9,cc=1e9,d=-1e9;for(const g of this.g){a=Math.min(a,g.x-g.r);b=Math.max(b,g.x+g.r);cc=Math.min(cc,g.y-g.r);d=Math.max(d,g.y+g.r)}const sx=(W-(b-a))/2-a,sy=(H-(d-cc))/2-cc;for(const g of this.g){g.x+=sx;g.y+=sy}this.th=0;this.drag=-1},
sync(){const G=this.g;G[0].th=this.th;for(let j=1;j<G.length;j++){const ra=G[j-1].n/G[j].n;G[j].th=-ra*G[j-1].th+G[j].b*(1+ra)+Math.PI-2.4*Math.PI/G[j].n}},
down(x,y){this.drag=this.g.findIndex(g=>hyp(g.x-x,g.y-y)<g.r);if(this.drag>=0){const g=this.g[this.drag];this.pa=Math.atan2(y-g.y,x-g.x)}},

frame(dt){clear();if(this.drag>=0){const j=this.drag,g=this.g[j],a=Math.atan2(P.y-g.y,P.x-g.x);let da=a-this.pa;da=Math.atan2(Math.sin(da),Math.cos(da));this.pa=a;this.th+=da*(j%2?-1:1)*g.n/this.g[0].n}
else this.th+=(clamp(P.x/W,0,1)-.5)*3*dt;this.sync();
this.g.forEach((g,i)=>{c.save();c.translate(g.x,g.y);c.rotate(g.th);c.fillStyle=PAL[i];c.beginPath();const ro=g.r+this.m*.9,ri=g.r-this.m*1.1,t=TAU/g.n;
for(let k=0;k<g.n;k++){const a=k*t;c.lineTo(Math.cos(a)*ri,Math.sin(a)*ri);c.lineTo(Math.cos(a+t*.2)*ro,Math.sin(a+t*.2)*ro);c.lineTo(Math.cos(a+t*.5)*ro,Math.sin(a+t*.5)*ro);c.lineTo(Math.cos(a+t*.7)*ri,Math.sin(a+t*.7)*ri)}c.closePath();
c.moveTo(g.r*.3,0);c.arc(0,0,g.r*.3,0,TAU,true);c.fill('evenodd');c.fillStyle='rgba(18,15,38,.35)';for(let k=0;k<4;k++){const a=k/4*TAU;c.beginPath();c.arc(Math.cos(a)*g.r*.58,Math.sin(a)*g.r*.58,g.r*.13,0,TAU);c.fill()}c.restore();circle(g.x,g.y,4,BG)})}});

toy({id:'galton',cat:'Физика',name:'Доска Гальтона',hint:'Шарики падают через ряды гвоздиков и складываются в колокол нормального распределения. Нажми, чтобы высыпать ещё горсть.',
init(){this.rows=11;this.sp=Math.min(W*.8/(this.rows+2),H*.045,34);this.top=H*.06;this.pegs=[];for(let r=0;r<this.rows;r++)for(let k=0;k<=r;k++)this.pegs.push({x:W/2+(k-r/2)*this.sp,y:this.top+30+r*this.sp*.9});
this.binY=this.top+30+this.rows*this.sp*.9+6;this.nb=this.rows+1;this.bins=new Array(this.nb).fill(0);this.b=[];this.acc=0;this.left=300},

const bx0=W/2-this.nb/2*this.sp;for(const b of this.b){b.vy+=.25;b.vx*=.99;b.x+=b.vx;b.y+=b.vy;for(const p of this.pegs){const dx=b.x-p.x,dy=b.y-p.y,d=hyp(dx,dy);if(d<br+3&&d>0){const nx=dx/d,ny=dy/d,vn=b.vx*nx+b.vy*ny;if(vn<0){b.vx-=1.5*vn*nx;b.vy-=1.5*vn*ny}b.x=p.x+nx*(br+3);b.y=p.y+ny*(br+3);b.vx+=R(-.3,.3)}}
if(b.y>this.binY){this.bins[clamp(Math.floor((b.x-bx0)/this.sp),0,this.nb-1)]++;b.dead=1}}this.b=this.b.filter(b=>!b.dead);
for(const p of this.pegs)circle(p.x,p.y,3,'#a19ac9');for(const b of this.b)circle(b.x,b.y,br,'#ffd25a');
const per=Math.max(1,Math.floor(this.sp/(br*2))),hmax=H-this.binY-6;c.strokeStyle='#2b2654';c.lineWidth=2;c.beginPath();for(let k=0;k<=this.nb;k++){c.moveTo(bx0+k*this.sp,this.binY);c.lineTo(bx0+k*this.sp,H)}c.stroke();
for(let k=0;k<this.nb;k++){const h=Math.min(hmax,Math.ceil(this.bins[k]/per)*br*1.2);c.fillStyle=PAL[k%6];c.fillRect(bx0+k*this.sp+2,H-h,this.sp-4,h)}

const y=H*base+Math.sin(x*.006+t*.5+k*2+sh)*H*.07*amp+Math.sin(x*.017-t*.8+k)*H*.03,h=H*(.12+.08*Math.sin(x*.01+t+k))*amp,gr=c.createLinearGradient(0,y-h,0,y+10);

toy({id:'ocean',cat:'Природа',name:'Море и кораблик',hint:'Кораблик качается на волнах и плывёт за курсором. Нажми — поднимется большая волна.',

if(li===1){this.bx+=(P.x-this.bx)*.01;const x=this.bx,y=y0+this.wave(x,t,k),sl=(this.wave(x+6,t,k)-this.wave(x-6,t,k))/12;c.save();c.translate(x,y-4);c.rotate(Math.atan(sl));

if(hyp(P.x-x,P.y-y)<r+10)hov={n,x,y,r}});if(hov)txt(hov.n,hov.x,hov.y-hov.r-14,13,'#efeaff','Manrope',700);stat(`Скорость времени ×${Math.round(sp*20)}`)}});

toy({id:'grass',cat:'Природа',name:'Трава на ветру',hint:'Травинки колышутся от ветра и расступаются перед курсором. Зажми — налетит порыв.',

if(P.y>b.y-b.h-20&&P.y<b.y&&Math.abs(dx)<60)push=(dx>0?1:-1)*(1-Math.abs(dx)/60)*1.1;b.v+=(wind+push-b.a)*.08;b.v*=.85;b.a+=b.v;

toy({id:'fire',cat:'Природа',name:'Костёр',hint:'Курсор — это ветер: пламя клонится от него. Нажми, чтобы подбросить дров, и костёр разгорится.',

c.globalCompositeOperation='source-over';c.fillStyle='#5a3726';for(const a of[-.25,.25,0]){c.save();c.translate(bx,by+12);c.rotate(a);rr(-70,-8,140,16,8);c.fill();c.restore()}
const glow=c.createRadialGradient(bx,by,0,bx,by,W*.5);glow.addColorStop(0,`rgba(255,140,60,${.08*this.pow})`);glow.addColorStop(1,'rgba(255,140,60,0)');c.fillStyle=glow;c.fillRect(0,0,W,H);

toy({id:'leaves',cat:'Природа',name:'Листопад',hint:'Листья кружатся и падают. Махни курсором — поднимешь их ветром, зажми — устроишь вихрь.',

frame(dt,t){const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2a2047');g.addColorStop(1,'#4a2a3a');c.fillStyle=g;c.fillRect(0,0,W,H);c.fillStyle='#3a2230';c.fillRect(0,H-14,W,14);
for(const l of this.l){const dx=l.x-P.x,dy=l.y-P.y,d=hyp(dx,dy)||1;if(d<120){const f=1-d/120;l.vx+=P.vx*.08*f;l.vy+=P.vy*.08*f;if(P.down){l.vx+=-dy/d*1.2*f+dx/d*.2;l.vy+=dx/d*1.2*f-f}if(Math.abs(P.vx)+Math.abs(P.vy)>1||P.down)l.g=false}
if(!l.g){l.vy+=.03;l.vx+=Math.sin(t*1.5+l.ph)*.04;l.vx*=.97;l.vy*=.97;l.vy=Math.min(l.vy,2.2);l.x+=l.vx;l.y+=l.vy;l.r+=l.vr+l.vx*.02;if(l.y>H-14-l.s*.3){l.y=H-14-l.s*.3;l.g=true;l.vx=l.vy=0}}

c.save();c.translate(l.x,l.y);c.rotate(l.r);c.fillStyle=l.c;c.beginPath();c.moveTo(0,-l.s);c.quadraticCurveTo(l.s*.8,0,0,l.s);c.quadraticCurveTo(-l.s*.8,0,0,-l.s);c.fill();c.strokeStyle='rgba(0,0,0,.25)';c.lineWidth=1;c.beginPath();c.moveTo(0,-l.s);c.lineTo(0,l.s+3);c.stroke();c.restore()}

toy({id:'constel',cat:'Природа',name:'Созвездия',hint:'Нажимай на звёзды по очереди — между ними протянутся линии. Нарисуй своё созвездие. Каждая звезда звучит своей нотой.',
init(){this.s=Array.from({length:W<600?50:90},()=>({x:R(14,W-14),y:R(14,H-14),r:R(1.2,3.4),p:R(0,TAU)}));this.lines=[];this.last=null;this.bg=Array.from({length:300},()=>({x:R(0,W),y:R(0,H)}))},

frame(dt,t){clear();c.fillStyle='rgba(255,255,255,.25)';for(const b of this.bg)c.fillRect(b.x,b.y,1,1);c.lineWidth=1.4;c.strokeStyle='rgba(169,200,255,.6)';
for(const[a,b,tm]of this.lines){const k=Math.min(1,(performance.now()-tm)/400);c.beginPath();c.moveTo(a.x,a.y);c.lineTo(a.x+(b.x-a.x)*k,a.y+(b.y-a.y)*k);c.stroke()}
for(const s of this.s){const tw=.6+.4*Math.sin(t*2+s.p),g=c.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r*4);g.addColorStop(0,`rgba(255,250,220,${tw})`);g.addColorStop(1,'rgba(255,250,220,0)');c.fillStyle=g;c.fillRect(s.x-s.r*4,s.y-s.r*4,s.r*8,s.r*8);circle(s.x,s.y,s.r*.7,'#fff')}

toy({id:'mount',cat:'Природа',name:'Горы на закате',hint:'Пять слоёв гор с параллаксом. Веди курсор влево-вправо, чтобы оглядеться, и вверх-вниз, чтобы поднять или опустить солнце.',
init(){this.L=[0,1,2,3,4].map(()=>{const n=257,a=new Float32Array(n);a[0]=R(0,1);a[n-1]=R(0,1);(function md(l,r,s){if(r-l<2)return;const m=(l+r)>>1;a[m]=(a[l]+a[r])/2+R(-s,s);md(l,m,s*.55);md(m,r,s*.55)})(0,n-1,.6);return a})},
frame(){const w=clamp(P.y/H,0,1),g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,`hsl(${250-w*30},50%,${30-w*15}%)`);g.addColorStop(.6,`hsl(${20-w*10},85%,${60-w*20}%)`);g.addColorStop(1,'#ffcf8a');c.fillStyle=g;c.fillRect(0,0,W,H);

this.L.forEach((a,k)=>{const base=H*(.45+k*.1),amp=H*(.3-k*.04),shift=-ox*(k+1)*60-60,n=a.length;c.fillStyle=`hsl(${260-k*12},${30+k*5}%,${42-k*7}%)`;c.beginPath();c.moveTo(0,H);

/* ---- игры ---- */
toy({id:'sling',cat:'Игры',name:'Рогатка',hint:'Оттяни снаряд от рогатки и отпусти. Сбей все мишени с платформы на землю.',
init(){this.lvl=this.lvl||1;this.shots=0;this.build()},
build(){this.won=false;this.ax=W*.16;this.ay=H*.62;this.gy=H-18;this.pl={x:W*.58,w:W*.36,y:H*.58};this.b=[];this.ball=null;this.aim=false;const r=Math.min(18,W*.03),rows=Math.min(5,2+this.lvl);

this.b=this.b.filter(b=>b.t);this.ball={x:this.ax,y:this.ay,vx:Math.cos(a)*d*.17,vy:Math.sin(a)*d*.17,r:11,c:'#efeaff',t:0};this.b.push(this.ball);noise(.15,.2,'bandpass',600);this.st()},
frame(){const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1c2550');g.addColorStop(1,'#3a3270');c.fillStyle=g;c.fillRect(0,0,W,H);c.fillStyle='#24452f';c.fillRect(0,this.gy,W,H-this.gy);
const pl=this.pl;c.fillStyle='#6b4a35';c.fillRect(pl.x,pl.y,pl.w,12);c.fillRect(pl.x+pl.w*.45,pl.y,pl.w*.1,this.gy-pl.y);

c.lineCap='round';for(let i=0;i<6;i++){this.fl[i]=Math.max(0,this.fl[i]-dt*3);const[x1,y1]=V[i],[x2,y2]=V[(i+1)%6];c.strokeStyle=PAL[i];c.globalAlpha=.4+this.fl[i]*.6;c.lineWidth=4+this.fl[i]*6;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke()}c.globalAlpha=1;
for(const b of this.b)circle(b.x,b.y,b.r,b.c)},
controls:[{t:'Убрать шарики',f(){this.b=[]}}]});

toy({id:'radar',cat:'Музыка',name:'Звёздный радар',hint:'Луч радара бежит по кругу и играет звёзды, которых касается. Ближе к центру — ниже нота. Нажимай, чтобы зажечь звезду, нажатие на звезду её гасит.',
SC:[0,2,4,7,9,12,14,16,19,21,24],
init(){this.a=0;if(!this.sp)this.sp=TAU/4;this.s=Array.from({length:10},()=>({a:R(0,TAU),d:R(.15,1),l:0}))},
down(x,y){const cx=W/2,cy=H/2,Rr=Math.min(W,H)*.44,dx=x-cx,dy=y-cy,d=hyp(dx,dy)/Rr;if(d>1)return;const hit=this.s.findIndex(s=>hyp(cx+Math.cos(s.a)*s.d*Rr-x,cy+Math.sin(s.a)*s.d*Rr-y)<14);
if(hit>=0)this.s.splice(hit,1);else this.s.push({a:(Math.atan2(dy,dx)+TAU)%TAU,d:Math.max(.08,d),l:0})},
frame(dt){clear(.3);const cx=W/2,cy=H/2,Rr=Math.min(W,H)*.44,pa=this.a;this.a=(this.a+this.sp*dt)%TAU;
c.strokeStyle='rgba(70,224,176,.18)';c.lineWidth=1;for(let k=1;k<=4;k++){c.beginPath();c.arc(cx,cy,Rr*k/4,0,TAU);c.stroke()}
for(const s of this.s){if(pa<=this.a?(s.a>pa&&s.a<=this.a):(s.a>pa||s.a<=this.a)){s.l=1;tone(196*Math.pow(2,this.SC[Math.min(10,Math.floor(s.d*11))]/12),.5,'sine',.1)}
s.l=Math.max(0,s.l-dt*1.5);circle(cx+Math.cos(s.a)*s.d*Rr,cy+Math.sin(s.a)*s.d*Rr,4+s.l*8,`rgba(255,210,90,${.5+s.l*.5})`)}
c.save();c.translate(cx,cy);c.rotate(this.a);c.fillStyle='rgba(70,224,176,.1)';c.beginPath();c.moveTo(0,0);c.arc(0,0,Rr,-.5,0);c.closePath();c.fill();c.strokeStyle='#46e0b0';c.lineWidth=3;c.beginPath();c.moveTo(0,0);c.lineTo(Rr,0);c.stroke();c.restore()},
controls:[{t:'Медленнее',f(){this.sp=Math.max(TAU/12,this.sp*.8)}},{t:'Быстрее',f(){this.sp=Math.min(TAU,this.sp*1.25)}},{t:'Очистить',f(){this.s=[]}}]});

/* ---- гипноз ---- */
toy({id:'hypno',cat:'Гипноз',name:'Гипноспираль',hint:'Вращающаяся спираль следует за курсором. Зажми — она закрутится быстрее. Долго не смотри!',
init(){this.a=0;this.cx=W/2;this.cy=H/2},
frame(dt){this.a+=dt*(P.down?6:2);this.cx+=(P.x-this.cx)*.05;this.cy+=(P.y-this.cy)*.05;clear();const M=hyp(W,H);c.lineWidth=Math.min(W,H)*.035;c.lineCap='round';
for(let arm=0;arm<2;arm++){c.strokeStyle=arm?'#a98bff':'#ffd25a';c.beginPath();for(let r=0;r<M;r+=3){const th=r*.025-this.a+arm*Math.PI,x=this.cx+Math.cos(th)*r,y=this.cy+Math.sin(th)*r;r?c.lineTo(x,y):c.moveTo(x,y)}c.stroke()}}});

toy({id:'moire',cat:'Гипноз',name:'Муар',hint:'Два одинаковых узора накладываются друг на друга, и появляются призрачные волны. Двигай курсор и переключай режим.',
init(){if(!this.m)this.m='c'},
frame(){c.fillStyle='#f3efe6';c.fillRect(0,0,W,H);c.strokeStyle='#120f26';c.lineWidth=2;const M=hyp(W,H);
if(this.m==='c'){for(const[x,y]of[[W/2,H/2],[P.x,P.y]]){c.beginPath();for(let r=6;r<M*1.5;r+=7){c.moveTo(x+r,y);c.arc(x,y,r,0,TAU)}c.stroke()}}
else for(const a of[0,(P.x/W-.5)*.4]){c.save();c.translate(W/2,H/2);c.rotate(a);c.beginPath();for(let x=-M;x<M;x+=7){c.moveTo(x,-M);c.lineTo(x,M)}c.stroke();c.restore()}},
controls:[{t:'Круги',on(){return this.m==='c'},f(){this.m='c'}},{t:'Линии',on(){return this.m==='l'},f(){this.m='l'}}]});

toy({id:'tunnel',cat:'Гипноз',name:'Тоннель',hint:'Полёт сквозь бесконечный тоннель из колец. Курсор поворачивает тоннель, зажатая кнопка ускоряет полёт.',
init(){this.z=0;this.v=1;this.cx=W/2;this.cy=H/2},
frame(dt,t){clear();this.v+=((P.down?5:1)-this.v)*.05;this.z+=dt*this.v;this.cx+=(P.x-this.cx)*.06;this.cy+=(P.y-this.cy)*.06;const M=Math.max(W,H),fr=(this.z*4)%1;
for(let i=40;i>0;i--){const zz=Math.max(.15,i-fr),sc=1/zz,r=M*.6*sc,k=1-clamp(sc*2.5,0,1),x=W/2+(this.cx-W/2)*k,y=H/2+(this.cy-H/2)*k,id=Math.floor(i+this.z*4);
c.strokeStyle=`hsla(${(id*18)%360},85%,${Math.min(75,40+90*sc)}%,${Math.min(1,sc*6)})`;c.lineWidth=Math.max(1,30*sc);c.beginPath();const rot=id*.15+t*.2;for(let s=0;s<=6;s++){const a=rot+s/6*TAU;s?c.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r):c.moveTo(x+Math.cos(a)*r,y+Math.sin(a)*r)}c.stroke()}}});

toy({id:'plasma',cat:'Гипноз',name:'Плазма',hint:'Переливающаяся плазма из сложенных синусоид. Курсор добавляет свою волну, нажатие меняет палитру.',
init(){offscreen(this,W<600?6:5);if(this.pi===undefined)this.pi=0;this.mk()},
mk(){const pal=[[0,60,90],[180,60,55],[260,80,60],[30,90,55]][this.pi%4];this.pal=new Uint32Array(256);for(let i=0;i<256;i++){const[r,g,b]=hsl2rgb(hueN(pal[0]+Math.sin(i/256*TAU)*pal[1]),85,40+20*Math.sin(i/256*TAU*2+pal[2]));this.pal[i]=rgb32(r,g,b)}},
down(){this.pi++;this.mk()},
frame(dt,t){const{gw,gh,cs}=this,px=P.x/cs,py=P.y/cs;let k=0;for(let j=0;j<gh;j++)for(let i=0;i<gw;i++,k++){const v=Math.sin(i*.09+t)+Math.sin(j*.11-t*1.3)+Math.sin((i+j)*.06+t*.7)+Math.sin(Math.sqrt((i-px)*(i-px)+(j-py)*(j-py))*.25-t*2.5);this.d32[k]=this.pal[((v+4)*32)&255]}
blit(this,true)}});

toy({id:'matrix',cat:'Гипноз',name:'Цифровой дождь',hint:'Потоки символов стекают по экрану. Рядом с курсором они вспыхивают розовым, а зажатая кнопка ускоряет дождь.',
init(){this.fs=W<600?14:16;this.cols=Math.ceil(W/this.fs);this.y=Array.from({length:this.cols},()=>R(-40,0));this.ch='АБВГДЕЖЗИКЛМНОПРСТУФХЦЧШЭЮЯ0123456789アイウエオカキクケコサシスセソ';c.fillStyle='#020806';c.fillRect(0,0,W,H)},
frame(){c.fillStyle='rgba(2,8,6,.09)';c.fillRect(0,0,W,H);c.font=`500 ${this.fs}px JetBrains Mono, monospace`;c.textAlign='center';c.textBaseline='top';const sp=P.down?2.5:1;
for(let i=0;i<this.cols;i++){const x=i*this.fs+this.fs/2,y=this.y[i]*this.fs,near=Math.abs(x-P.x)<70&&Math.abs(y-P.y)<160;c.fillStyle=near?'#ff8fd0':Math.random()<.1?'#d7ffe9':'#46e0b0';c.fillText(this.ch[RI(0,this.ch.length-1)],x,y);
this.y[i]+=sp*(near?1.8:1)*.5;if(y>H&&Math.random()<.03)this.y[i]=R(-10,0)}}});

toy({id:'mandel',cat:'Гипноз',name:'Фрактал Мандельброта',hint:'Нажми в любую точку — картинка приблизится туда в 3 раза. Фрактал бесконечен: новые детали появляются на любом увеличении.',
init(){this.cx=-.6;this.cy=0;this.sc=3.2/Math.min(W,H)*1.15;this.z=1;this.go()},
go(){offscreen(this,W<600?3:2);this.d32.fill(0xff260f12);this.row=0;this.it=Math.floor(80+Math.log2(this.z)*25);stat(`Увеличение ×${this.z<1e4?Math.round(this.z):this.z.toExponential(1)}`)},
down(x,y){this.cx+=(x-W/2)*this.sc;this.cy+=(y-H/2)*this.sc;this.sc/=3;this.z*=3;this.go()},
frame(){const{gw,gh,cs,it}=this,t0=performance.now();while(this.row<gh&&performance.now()-t0<12){const j=this.row++,ci=this.cy+(j*cs-H/2)*this.sc;for(let i=0;i<gw;i++){const cr=this.cx+(i*cs-W/2)*this.sc;let x=0,y=0,n=0;
while(x*x+y*y<16&&n<it){const xt=x*x-y*y+cr;y=2*x*y+ci;x=xt;n++}let v=0xff260f12;if(n<it){const sm=n+1-Math.log2(Math.log2(x*x+y*y)/2),[r,g,b]=hsl2rgb(hueN(sm*9+220),85,clamp(25+sm*1.5,25,65));v=rgb32(r,g,b)}this.d32[j*gw+i]=v}}
blit(this,false)},
controls:[{t:'Отдалить',f(){if(this.z>1){this.sc*=3;this.z/=3;this.go()}}},{t:'Сбросить',f(){this.init()}}]});

toy({id:'voronoi',cat:'Гипноз',name:'Витраж',hint:'Мозаика Вороного: каждое стёклышко принадлежит ближайшей точке. Точки плывут, курсор тоже точка. Нажми, чтобы добавить стёклышко.',
init(){offscreen(this,W<600?7:6);this.p=Array.from({length:W<600?16:26},()=>this.np(R(0,W),R(0,H)))},
np(x,y){const[r,g,b]=hsl2rgb(R(0,360),75,R(45,65));return{x,y,vx:R(-.5,.5),vy:R(-.5,.5),col:rgb32(r,g,b)}},
down(x,y){if(this.p.length<60)this.p.push(this.np(x,y))},
frame(){for(const p of this.p){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1}const all=[...this.p,{x:P.x,y:P.y,col:0xfff6f2ff}],{gw,gh,cs}=this,lead=0xff1a1410,th=cs*1.2;let k=0;
for(let j=0;j<gh;j++){const y=j*cs;for(let i=0;i<gw;i++,k++){const x=i*cs;let d1=1e12,d2=1e12,ci=0;for(let q=0;q<all.length;q++){const dx=x-all[q].x,dy=y-all[q].y,d=dx*dx+dy*dy;if(d<d1){d2=d1;d1=d;ci=q}else if(d<d2)d2=d}
this.d32[k]=Math.sqrt(d2)-Math.sqrt(d1)<th?lead:all[ci].col}}blit(this,false)}});

toy({id:'flow',cat:'Гипноз',name:'Поток частиц',hint:'Тысячи частиц текут по невидимому полю и оставляют шёлковые следы. Курсор закручивает вихрь, нажатие меняет рисунок поля.',
init(){this.seed=R(0,100);this.p=Array.from({length:W<600?800:1500},()=>({x:R(0,W),y:R(0,H),l:R(50,200)}));clear()},
down(){this.seed=R(0,100);clear()},
frame(dt,t){c.fillStyle='rgba(18,15,38,.05)';c.fillRect(0,0,W,H);c.lineWidth=1;const s=this.seed;c.globalCompositeOperation='lighter';
for(const p of this.p){let a=Math.sin(p.x*.004+s)*2+Math.cos(p.y*.005+s*1.3)*2+Math.sin((p.x+p.y)*.002+t*.2);const dx=p.x-P.x,dy=p.y-P.y,d=hyp(dx,dy);if(d<150)a=a*(d/150)+(Math.atan2(dy,dx)+Math.PI/2)*(1-d/150);
const nx=p.x+Math.cos(a)*1.5,ny=p.y+Math.sin(a)*1.5;c.strokeStyle=`hsla(${hueN(a*50+s*20)},80%,60%,.25)`;c.beginPath();c.moveTo(p.x,p.y);c.lineTo(nx,ny);c.stroke();p.x=nx;p.y=ny;p.l--;
if(p.l<0||p.x<0||p.x>W||p.y<0||p.y>H){p.x=R(0,W);p.y=R(0,H);p.l=R(50,200)}}}});

toy({id:'truchet',cat:'Гипноз',name:'Узор Трюше',hint:'Плитки с дугами складываются в бесконечные извилистые дорожки. Проведи курсором — плитки повернутся. Нажми для новой раскраски.',
init(){this.s=W<600?36:48;this.cols=Math.ceil(W/this.s);this.rows=Math.ceil(H/this.s);this.t=Array.from({length:this.cols*this.rows},()=>{const r=RI(0,1)*Math.PI/2;return{a:r,ta:r}});if(this.h===undefined)this.h=R(0,360);this.last=-1},
down(){this.h=R(0,360)},
frame(){const{s,cols}=this,i=Math.floor(P.x/s),j=Math.floor(P.y/s),k=j*cols+i;if(i>=0&&j>=0&&i<cols&&j<this.rows&&k!==this.last){this.t[k].ta+=Math.PI/2;this.last=k;tone(300+((i+j)%5)*80,.05,'sine',.03)}
c.fillStyle=`hsl(${this.h},40%,14%)`;c.fillRect(0,0,W,H);c.lineWidth=s*.22;c.lineCap='butt';
this.t.forEach((t,n)=>{t.a+=(t.ta-t.a)*.2;const x=(n%cols)*s+s/2,y=(n/cols|0)*s+s/2;c.save();c.translate(x,y);c.rotate(t.a);c.strokeStyle=`hsl(${(this.h+((n%cols)+(n/cols|0))*4)%360},80%,62%)`;c.beginPath();c.arc(-s/2,-s/2,s/2,0,Math.PI/2);c.stroke();c.beginPath();c.arc(s/2,s/2,s/2,Math.PI,Math.PI*1.5);c.stroke();c.restore()})}});


/* ---------- каркас ---------- */
const menu=document.getElementById('menu'),ctrlEl=document.getElementById('ctrls'),btns={};
(function(){const n=T.length,m10=n%10,m100=n%100,w=m10===1&&m100!==11?'игрушка':m10>=2&&m10<=4&&(m100<12||m100>14)?'игрушки':'игрушек';document.getElementById('count').textContent=n+' '+w+' на одной странице'})();
for(const cat of Object.keys(CATS)){const gdiv=document.createElement('div');gdiv.className='grp';gdiv.style.setProperty('--cat',CATS[cat]);const h=document.createElement('h3');h.textContent=cat;gdiv.appendChild(h);
for(const t of T.filter(t=>t.cat===cat)){const b=document.createElement('button');b.type='button';b.className='toy';b.textContent=t.name;b.onclick=()=>select(t.id);gdiv.appendChild(b);btns[t.id]=b}menu.appendChild(gdiv)}
const ORDER=Object.keys(CATS).flatMap(cat=>T.filter(t=>t.cat===cat));

function renderCtrls(){ctrlEl.innerHTML='';(cur.controls||[]).forEach(o=>{const b=document.createElement('button');b.type='button';
if(o.sw){b.className='sw';b.style.background=o.sw;b.setAttribute('aria-label',o.t+' '+o.sw)}else{b.className='ctrl';b.textContent=typeof o.t==='function'?o.t.call(cur):o.t}
if(o.on)b.setAttribute('aria-pressed',o.on.call(cur)?'true':'false');b.onclick=()=>{audio();o.f.call(cur);renderCtrls()};ctrlEl.appendChild(b)})}
function start(t){if(cur&&cur.leave)cur.leave();cur=t;P.down=false;c.setTransform(dpr,0,0,dpr,0,0);c.globalCompositeOperation='source-over';c.globalAlpha=1;c.imageSmoothingEnabled=true;stat('');clear();t.init();renderCtrls()}
function select(id){const t=T.find(x=>x.id===id)||ORDER[0];for(const k in btns)btns[k].setAttribute('aria-current',k===t.id?'true':'false');
document.getElementById('tname').textContent=t.name;document.getElementById('thint').textContent=t.hint;start(t);
try{history.replaceState(null,'','#'+t.id)}catch(e){}const b=btns[t.id];if(b&&b.scrollIntoView)b.scrollIntoView({block:'nearest',inline:'center'})}
function go(d){const i=ORDER.indexOf(cur);select(ORDER[(i+d+ORDER.length)%ORDER.length].id)}
document.getElementById('prev').onclick=()=>go(-1);document.getElementById('next').onclick=()=>go(1);document.getElementById('again').onclick=()=>start(cur);
document.getElementById('rnd').onclick=()=>{let t;do t=pick(T);while(t===cur);select(t.id)};
const sndB=document.getElementById('snd');sndB.onclick=()=>{muted=!muted;sndB.textContent='Звук: '+(muted?'выкл':'вкл');audio()};

function upd(e){const r=cv.getBoundingClientRect();P.x=e.clientX-r.left;P.y=e.clientY-r.top;P.type=e.pointerType||'mouse'}
cv.addEventListener('pointerdown',e=>{try{cv.setPointerCapture(e.pointerId)}catch(_){}upd(e);P.button=e.button||0;P.down=true;audio();cur.down&&cur.down(P.x,P.y)});
cv.addEventListener('pointermove',e=>{upd(e);cur.move&&cur.move(P.x,P.y)});
const release=()=>{if(P.down){P.down=false;cur.up&&cur.up(P.x,P.y)}};addEventListener('pointerup',release);addEventListener('pointercancel',release);
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey||e.repeat)return;if(e.target&&e.target.tagName==='INPUT')return;if(e.target.closest&&e.target.closest('button')&&(e.key===' '||e.key==='Enter'))return;
if(cur.key){audio();if(cur.key(e.key.toLowerCase())===true){e.preventDefault();return}}if(e.key==='ArrowRight')go(1);else if(e.key==='ArrowLeft')go(-1)});
const qEl=document.getElementById('q');qEl.addEventListener('input',()=>{const q=qEl.value.trim().toLowerCase();for(const t of T)btns[t.id].hidden=!!q&&!t.name.toLowerCase().includes(q)&&!t.cat.toLowerCase().includes(q);menu.querySelectorAll('.grp').forEach(g=>g.hidden=![...g.querySelectorAll('.toy')].some(b=>!b.hidden))});qEl.addEventListener('keydown',e=>{if(e.key==='Enter'){const t=T.find(t=>!btns[t.id].hidden);if(t)select(t.id)}});

function resize(){const r=stage.getBoundingClientRect(),nw=Math.floor(r.width),nh=Math.floor(r.height);if(nw===W&&nh===H)return;const first=!W;W=nw;H=nh;dpr=Math.min(2,devicePixelRatio||1);
cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';if(first){P.x=P.lx=W/2;P.y=P.ly=H/2}if(cur)start(cur)}
let rt;new ResizeObserver(()=>{clearTimeout(rt);rt=setTimeout(resize,120)}).observe(stage);
resize();select((location.hash||'').slice(1)||'follow');
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(cur&&cur.id==='repel')start(cur)});

let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;P.vx=P.x-P.lx;P.vy=P.y-P.ly;P.sp=hyp(P.vx,P.vy);P.lx=P.x;P.ly=P.y;
if(W&&H){c.save();try{cur.frame(dt,now/1000)}catch(err){console.error(err)}c.restore()}requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>

</body>
